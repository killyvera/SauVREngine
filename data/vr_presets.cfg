// Presets de rendimiento y calidad del visor (SauVREngine).
//   vrpreset_rendimiento  → máximo de fps, imagen más suave en la periferia
//   vrpreset_equilibrio   → el que se aplica por defecto (fps estables con claridad)
//   vrpreset_calidad      → más reflejos, refracción y distancia; solo si el visor aguanta
// Se eligen en opciones → vr o con la consola. Son propuestas sin medir en Quest 3:
// cada cambio se valida con la línea sauvr map=… de la telemetría (p95, late, refl, fps).
// maxreflect es el tope de planos de agua que se redibujan por frame: es el coste real de
// los reflejos (vrreflectevery solo reparte ese tope entre frames).
// vrfogmax acorta la niebla del mapa (0 = la del mapa): más allá, la geometría se dibuja como
// niebla sin texturas, así que bajan los draws y los lotes en zonas abiertas.
// vrreflectmodels 0 quita bots, jugadores y objetos del reflejo del agua (casi no se ven en él).
// vrreflectlite 1 dibuja la geometría del reflejo sin texturas, un draw por VA (el reflejo era ~7 ms).
// vrreflectlite 2 (calidad): reflejo con texturas hasta vrreflectnear y ligero más allá.
// Cada preset fija maxtexsize (0 = sin límite) para no heredar el del preset anterior; el cambio se
// nota al recargar las texturas (al cargar mapa). vrautocapture 0: la captura automática da tirones.
// Los tres presets mantienen luces dinámicas (disparos, explosiones), fogonazos y sangre, y una sombra
// de modelos: en rendimiento es ligera (shadowmapsize 7, radio 96).

vrpreset_rendimiento = [
    vrfoveation 3; vrfoveationdynamic 1
    waterreflect 1; waterrefract 0; vrsharereflections 1; vrreflectevery 4; maxreflect 1
    reflectsize 6; reflectdist 1000
    vrmaxemitters 12; vremitterdist 384
    maxmodelradiusdistance 60; maxdynlights 2; grass 0
    muzzleflash 1; muzzlelight 1; blood 1
    vrfogmax 800; vrreflectmodels 0; vrreflectlite 1; vrautocapture 0
    maxtexsize 512; shaderdetail 2; bumpmodels 0; envmapmodels 0
    shadowmap 1; shadowmapsize 7; shadowmapradius 96; blurshadowmap 1; shadowmapintensity 75
]

vrpreset_equilibrio = [
    vrfoveation 2; vrfoveationdynamic 1
    waterreflect 1; waterrefract 0; vrsharereflections 1; vrreflectevery 2; maxreflect 2
    reflectsize 7; reflectdist 1500
    vrmaxemitters 24; vremitterdist 512
    maxmodelradiusdistance 160; maxdynlights 2; grass 0
    muzzleflash 1; muzzlelight 1; blood 1
    maxtexsize 0
    vrfogmax 1000; vrreflectmodels 0; vrreflectlite 1; vrautocapture 0
    shaderdetail 3; bumpmodels 1; envmapmodels 1
    shadowmap 1; shadowmapsize 8; shadowmapradius 128; blurshadowmap 2; shadowmapintensity 75
]

vrpreset_calidad = [
    vrfoveation 1; vrfoveationdynamic 1
    waterreflect 1; waterrefract 1; vrsharereflections 1; vrreflectevery 1; maxreflect 3
    reflectsize 8; reflectdist 3000
    vrmaxemitters 48; vremitterdist 768
    maxmodelradiusdistance 300; maxdynlights 3; grass 1
    muzzleflash 1; muzzlelight 1; blood 1
    maxtexsize 0
    vrfogmax 0; vrreflectmodels 1; vrreflectlite 2; vrreflectnear 256; vrautocapture 0
    shaderdetail 3; bumpmodels 1; envmapmodels 1
    shadowmap 1; shadowmapsize 10; shadowmapradius 256; blurshadowmap 2; shadowmapintensity 75
]

// Versión de los presets. Al subirla, el visor vuelve a aplicar el de equilibrio una vez
// (vrpresetapplied guarda la última versión aplicada; después manda lo que el usuario elija).
vrpresetbuild = 11
if (!= $vrpresetapplied $vrpresetbuild) [ vrpreset_equilibrio; vrpresetapplied $vrpresetbuild ]
